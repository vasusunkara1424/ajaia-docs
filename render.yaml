# Render Blueprint: one Docker web service on the free plan.
# DATABASE_URL is set in the Render dashboard to a free Neon Postgres connection string.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
